name: build

# 작업 PC 에 Docker 가 없어서 빌드를 여기서 합니다.
# 덤으로 **풀린 이미지 크기**를 재서 요약에 남깁니다 — Vast 인스턴스의
# 디스크를 몇 GB 로 잡을지가 여기서 정해집니다. Docker Hub 나 ghcr 에
# 표시되는 숫자는 압축값이라 그대로 쓰면 2배쯤 과소평가합니다.

on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - on-start.sh
      - .github/workflows/build.yml
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      # 러너 기본 여유가 14GB 안팎이라 CUDA 이미지에는 빠듯합니다.
      - name: 디스크 확보
        run: |
          echo "=== 정리 전 ==="
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          echo "=== 정리 후 ==="
          df -h /

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 빌드 · 푸시
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 실제 디스크 크기 측정
        run: |
          set -e
          docker pull "$IMAGE:latest"
          docker pull ghcr.io/speaches-ai/speaches:latest-cuda

          ours=$(docker image inspect "$IMAGE:latest" --format '{{.Size}}')
          base=$(docker image inspect ghcr.io/speaches-ai/speaches:latest-cuda --format '{{.Size}}')

          gb() { awk -v b="$1" 'BEGIN { printf "%.2f", b/1024/1024/1024 }'; }

          {
            echo "## 이미지 크기 (풀린 값)"
            echo ""
            echo "| | 크기 |"
            echo "|---|---|"
            echo "| speaches 원본 | $(gb "$base") GB |"
            echo "| **chatos-audio** | **$(gb "$ours") GB** |"
            echo ""
            echo "여기에 모델(large-v3-turbo 약 1.6GB)과 여유가 더 필요합니다."
            echo "Vast 인스턴스 디스크는 이 합보다 넉넉히 잡으세요."
          } >> "$GITHUB_STEP_SUMMARY"

          docker image ls
